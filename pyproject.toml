[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-sandbox"
version = "0.1.0"
description = "Bayesian media-mix modeling sandbox: adstock, saturation, ROI posteriors, budget optimization."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["mmm_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # ArviZ prints a FutureWarning about its ongoing refactor on import; not actionable for us.
    "ignore::FutureWarning:arviz",
]
